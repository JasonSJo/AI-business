<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css" />
<style>
  html,body{width:1200px;height:630px}
  .grid{position:absolute;inset:0;display:grid;grid-template-columns:1.25fr 1fr}
  .copy{padding:104px 0 0 96px}
  .eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:38px}
  .eyebrow .rule{width:44px;height:2px;background:var(--clay)}
  .eyebrow .t{font-family:'DM Mono',monospace;font-size:19px;letter-spacing:.3em;color:var(--pine)}
  h1{font-family:'Gowun Batang',serif;font-size:76px;line-height:1.3;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  h1 em{font-style:normal;color:var(--clay-d)}
  .sub{margin-top:34px;font-size:24px;color:var(--muted);letter-spacing:.01em;white-space:nowrap}
  /* 우측 — 인장과 사업의 네 글자 */
  .art{position:relative}
  .art svg{position:absolute;inset:0}
  .seal{
    position:absolute;right:150px;top:118px;width:270px;height:270px;border-radius:50%;
    background:radial-gradient(135% 120% at 30% 22%, var(--pine-l), var(--pine) 60%, #2E3C29);
    display:grid;place-items:center;color:var(--cream);
    font-family:'Gowun Batang',serif;font-size:140px;
    box-shadow:0 30px 70px -30px rgba(35,40,31,.5);
  }
  .seal i{font-style:normal;transform:translateY(-6px)}
  .seal .dot{position:absolute;right:34px;bottom:40px;width:28px;height:28px;border-radius:50%;background:var(--clay)}
  .glyphs{position:absolute;right:150px;bottom:96px;display:flex;gap:18px}
  .g{
    width:64px;height:64px;border-radius:16px;border:1.5px solid var(--line);
    display:grid;place-items:center;font-family:'Gowun Batang',serif;font-size:30px;
    color:var(--pine);background:rgba(255,255,255,.55);
  }
</style>
</head>
<body>
  <div class="grid">
    <div class="copy">
      <div class="eyebrow"><span class="rule"></span><span class="t">JASON'S CONSULTING</span></div>
      <h1>예약받는 페이지,<br><em>48시간</em> 안에.</h1>
      <div class="sub">병원 · 미용실 · 카페 · 필라테스<br>무료 샘플 먼저, 결제는 나중에</div>
    </div>
    <div class="art">
      <svg viewBox="0 0 500 630" fill="none">
        <circle cx="285" cy="253" r="192" stroke="rgba(35,40,31,.13)" stroke-width="1.5"/>
        <circle cx="285" cy="253" r="228" stroke="rgba(35,40,31,.07)" stroke-width="1.5"/>
        <circle cx="285" cy="253" r="228" stroke="#C0784F" stroke-width="2.5"
                stroke-dasharray="86 1347" stroke-linecap="round" transform="rotate(-58 285 253)"/>
      </svg>
      <div class="seal"><i>J</i><span class="dot"></span></div>
      <div class="glyphs">
        <span class="g">高</span><span class="g">笑</span><span class="g">溫</span><span class="g">香</span>
      </div>
    </div>
  </div>
</body>
</html>
