<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>리드 수집기 · Jason's Consulting</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{--cream:#F4EFE6;--ink:#23281F;--soft:#4B4E42;--muted:#8A8474;--line:rgba(35,40,31,.14);
        --pine:#3F5138;--clay:#C0784F;--clay-d:#A5603A}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;padding:22px 14px 90px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:20px;font-weight:800}
  .sub{font-size:12.5px;color:var(--muted);margin:4px 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:12px 0 5px}
  label:first-child{margin-top:0}
  input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;font:inherit;font-size:15px;background:#fff}
  input:focus,textarea:focus{outline:2px solid var(--pine);outline-offset:-1px}
  textarea{resize:none;height:64px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:transparent;padding:8px 14px;border-radius:100px;font:inherit;font-size:13px;cursor:pointer;color:var(--soft)}
  .chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
  .hint button{border:none;background:none;color:var(--clay-d);cursor:pointer;font:inherit;font-size:11.5px;text-decoration:underline;padding:0 2px}
  .add{width:100%;margin-top:16px;background:var(--clay);color:#fff;border:none;border-radius:100px;padding:14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .add:active{transform:scale(.98)}
  .bar{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
  .bar b{font-size:17px}
  .bar .sp{margin-left:auto;display:flex;gap:7px}
  .sm{border:1px solid var(--line);background:transparent;padding:8px 14px;border-radius:100px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--soft)}
  .lead{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
  .lead .nm{font-weight:700;font-size:14.5px}
  .lead .mt{font-size:12px;color:var(--muted);margin-top:2px}
  .lead .ob{font-size:12.5px;color:var(--soft);margin-top:4px}
  .lead .del{margin-left:auto;border:none;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px}
  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 0}
  .foot{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>리드 수집기</h1>
  <div class="sub">네이버 지도·인스타를 보다가 발견하면 20초 안에 기록 → CSV로 내보내 발송센터 생성</div>

  <div class="card">
    <label>업체명 *</label>
    <input id="fB" placeholder="예: 연남 살롱블루" />
    <label>업종</label>
    <div class="chips" id="cInd">
      <button class="chip on" data-v="salon">미용실</button>
      <button class="chip" data-v="cafe">카페</button>
      <button class="chip" data-v="pilates">필라테스</button>
      <button class="chip" data-v="dental">치과</button>
      <button class="chip" data-v="">기타</button>
    </div>
    <label>채널</label>
    <div class="chips" id="cCh">
      <button class="chip on" data-v="dm">인스타 DM</button>
      <button class="chip" data-v="email">이메일</button>
    </div>
    <label>연락처 (인스타 핸들 또는 이메일) *</label>
    <input id="fC" placeholder="@handle 또는 email@..." />
    <label>관찰 한 줄 * — 응답률을 결정합니다</label>
    <textarea id="fO" placeholder="예: 리뷰 200개인데 프로필에 예약 링크가 없어서요."></textarea>
    <div class="hint">막히면 탭:
      <button onclick="ob('프로필에 예약 링크가 없어서요.')">링크 없음</button>·
      <button onclick="ob('리뷰가 좋은데 검색하면 홈페이지가 안 나와서요.')">검색 안 됨</button>·
      <button onclick="ob('예약을 DM으로만 받고 계신 것 같아서요.')">DM 예약</button>·
      <button onclick="ob('가격·시술 안내가 한 페이지로 정리돼 있지 않아서요.')">안내 분산</button>
    </div>
    <button class="add" onclick="add()">+ 리드 추가</button>
  </div>

  <div class="bar">
    <b id="cnt">0</b><span style="font-size:13px;color:var(--muted)">곳 수집됨</span>
    <span class="sp">
      <button class="sm" onclick="exportCsv()">CSV 내보내기</button>
      <button class="sm" onclick="wipe()">비우기</button>
    </span>
  </div>
  <div id="list"></div>

  <p class="foot">
    · 데이터는 이 브라우저(localStorage)에만 저장됩니다.<br>
    · CSV를 <b>tools/cold-email-generator/</b>에 놓고 <b>python3 generate.py 파일명.csv --sender 제이슨 --base-url https://jasons-consulting.com/</b> 실행 → 발송센터 완성.<br>
    · 좋은 리드 기준: 장사는 잘되는데(리뷰·팔로워) 웹 존재감이 없는 곳.
  </p>
</div>

<script>
'use strict';
const K='jc-leads';
let leads=JSON.parse(localStorage.getItem(K)||'[]');
const $=s=>document.querySelector(s);
const owners={salon:'실장님',cafe:'사장님',pilates:'대표님',dental:'원장님','':'대표님'};

document.querySelectorAll('.chips').forEach(g=>g.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on');
}));
const pick=id=>document.querySelector('#'+id+' .chip.on').dataset.v;
function ob(t){ $('#fO').value=t; }

function add(){
  const b=$('#fB').value.trim(), c=$('#fC').value.trim(), o=$('#fO').value.trim();
  if(!b||!c||!o){ alert('업체명·연락처·관찰 한 줄은 필수입니다.'); return; }
  const ind=pick('cInd');
  leads.push({business:b, owner:owners[ind], industry:ind, channel:pick('cCh'), observation:o, contact:c});
  save(); ['fB','fC','fO'].forEach(i=>$('#'+i).value='');
  $('#fB').focus();
}
function del(i){ leads.splice(i,1); save(); }
function wipe(){ if(confirm('전체 삭제할까요? (CSV 먼저 내보내기 권장)')){ leads=[]; save(); } }
function save(){ localStorage.setItem(K,JSON.stringify(leads)); render(); }

function render(){
  $('#cnt').textContent=leads.length;
  $('#list').innerHTML=leads.length?leads.map((l,i)=>
    '<div class="lead"><div><div class="nm">'+esc(l.business)+'</div>'+
    '<div class="mt">'+(l.industry||'기타')+' · '+l.channel+' · '+esc(l.contact)+'</div>'+
    '<div class="ob">'+esc(l.observation)+'</div></div>'+
    '<button class="del" onclick="del('+i+')">×</button></div>').reverse().join('')
    :'<div class="empty">아직 없습니다 — 지도 앱 옆에 띄워두고 발견 즉시 기록하세요</div>';
}
function esc(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML}

function exportCsv(){
  if(!leads.length){ alert('수집된 리드가 없습니다.'); return; }
  const head='business,owner,industry,channel,observation,contact';
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=leads.map(l=>[l.business,l.owner,l.industry,l.channel,l.observation,l.contact].map(q).join(','));
  const blob=new Blob(['﻿'+head+'\n'+rows.join('\n')+'\n'],{type:'text/csv;charset=utf-8'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),
    download:'leads-'+new Date().toISOString().slice(0,10)+'.csv'});
  a.click(); URL.revokeObjectURL(a.href);
}
render();
</script>
</body>
</html>
