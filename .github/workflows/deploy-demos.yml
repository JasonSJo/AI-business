name: Deploy demos to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/video-content-monetization-idjfzc
    paths:
      - "site-redirect/**"
      - ".github/workflows/deploy-demos.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 사용자 결정(2026-07-23): 자체 사이트 대신 Codex 사이트로 리다이렉트만 배포
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
